services:
  # 1. Reverse Proxy & Load Balancer
  load-balancer:
    image: nginx:alpine
    container_name: ems-load-balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - ems-network

  # 2. API Gateway
  api-gateway:
    build:
      context: ../
      dockerfile: backend/services/api-gateway/Dockerfile
    container_name: ems-api-gateway
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-default_jwt_secret}
      - AUTH_SERVICE_URL=http://auth-service:4001
      - EMPLOYEE_SERVICE_URL=http://employee-service:4002
      - ATTENDANCE_SERVICE_URL=http://attendance-service:4003
      - NOTIFICATION_SERVICE_URL=http://notification-service:4004
      - PAYROLL_SERVICE_URL=http://payroll-service:4005
      - CHATBOT_SERVICE_URL=http://chatbot-service:4006
    depends_on:
      - auth-service
      - employee-service
      - attendance-service
      - notification-service
      - payroll-service
    networks:
      - ems-network

  # 3. Auth Service
  auth-service:
    build:
      context: ../
      dockerfile: backend/services/auth-service/Dockerfile
    container_name: ems-auth-service
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - MONGODB_URI=mongodb://mongo-auth:27017/ems_auth
      - JWT_SECRET=${JWT_SECRET:-default_jwt_secret}
    depends_on:
      - mongo-auth
    networks:
      - ems-network

  # 4. Employee Service (With Redis Caching)
  employee-service:
    build:
      context: ../
      dockerfile: backend/services/employee-service/Dockerfile
    container_name: ems-employee-service
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - MONGODB_URI=mongodb://mongo-employee:27017/ems_employees
      - REDIS_URI=redis://redis-cache:6379
      - AUTH_SERVICE_URL=http://auth-service:4001
    depends_on:
      - mongo-employee
      - redis-cache
    networks:
      - ems-network

  # 5. Attendance & Leave Service (With Event Publishing)
  attendance-service:
    build:
      context: ../
      dockerfile: backend/services/attendance-service/Dockerfile
    container_name: ems-attendance-service
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
      - MONGODB_URI=mongodb://mongo-attendance:27017/ems_attendance
      - EMPLOYEE_SERVICE_URL=http://employee-service:4002
      - RABBITMQ_URI=amqp://rabbitmq:5672
    depends_on:
      - mongo-attendance
      - rabbitmq
    networks:
      - ems-network

  # 6. Notification Worker Service (Event Consumer + Cron)
  notification-service:
    build:
      context: ../
      dockerfile: backend/services/notification-service/Dockerfile
    container_name: ems-notification-service
    ports:
      - "4004:4004"
    environment:
      - PORT=4004
      - RABBITMQ_URI=amqp://rabbitmq:5672
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SENDER_EMAIL=${SENDER_EMAIL:-admin@example.com}
    depends_on:
      - rabbitmq
    networks:
      - ems-network

  # 7. Payroll Service
  payroll-service:
    build:
      context: ../
      dockerfile: backend/services/payroll-service/Dockerfile
    container_name: ems-payroll-service
    ports:
      - "4005:4005"
    environment:
      - PORT=4005
      - MONGODB_URI=mongodb://mongo-payroll:27017/ems_payroll
      - EMPLOYEE_SERVICE_URL=http://employee-service:4002
    depends_on:
      - mongo-payroll
    networks:
      - ems-network

  # 8. AI Chatbot Service
  chatbot-service:
    build:
      context: ../
      dockerfile: backend/services/chatbot-service/Dockerfile
    container_name: ems-chatbot-service
    ports:
      - "4006:4006"
    environment:
      - PORT=4006
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EMPLOYEE_SERVICE_URL=http://employee-service:4002
      - ATTENDANCE_SERVICE_URL=http://attendance-service:4003
    networks:
      - ems-network

  # --- Distributed Middleware Infrastructure ---

  # Redis Cache Layer
  redis-cache:
    image: redis:7-alpine
    container_name: ems-redis-cache
    ports:
      - "6379:6379"
    networks:
      - ems-network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ems-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # RabbitMQ Management Dashboard
    networks:
      - ems-network

  # Isolated Databases (Database-per-Service Pattern)
  mongo-auth:
    image: mongo:7.0
    container_name: ems-mongo-auth
    networks:
      - ems-network

  mongo-employee:
    image: mongo:7.0
    container_name: ems-mongo-employee
    networks:
      - ems-network

  mongo-attendance:
    image: mongo:7.0
    container_name: ems-mongo-attendance
    networks:
      - ems-network

  mongo-payroll:
    image: mongo:7.0
    container_name: ems-mongo-payroll
    networks:
      - ems-network

networks:
  ems-network:
    driver: bridge
