events {
    worker_connections 1024;
}

http {
    upstream gateway_cluster {
        least_conn; # Load balancing strategy: routes to least loaded gateway instance
        server api-gateway:4000 max_fails=3 fail_timeout=10s;
        # server api-gateway-replica:4000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Forward all /api requests to API Gateway cluster
        location /api/ {
            proxy_pass http://gateway_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://gateway_cluster/health;
        }

        # Static assets / Frontend proxy (if hosted behind Nginx)
        location / {
            proxy_pass http://client:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
        }
    }
}
